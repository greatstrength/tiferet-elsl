[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiferet-elsl"
version = "1.1.0b1"
description = "Domain-specific compiler for Tiferet component dialects"
license = {text = "Proprietary — All Rights Reserved"}
classifiers = [
    "License :: Other/Proprietary License",
    "Private :: Do Not Upload",
]
requires-python = ">=3.10"
dependencies = [
    "tiferet==2.1.1",
    "tiferet-ly>=1.0.0b3,<1.0.0rc1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "compiler*",
]

[project.scripts]
tiferet-compiler = "compiler.cli:main"

[tool.pytest.ini_options]
testpaths = ["compiler"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
