[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiferet-elsl"
version = "1.0.1"
description = "Domain-specific compiler for Tiferet component dialects"
authors = [
    { name = "Andrew Shatz, Great Strength Systems", email = "andrew@greatstrength.me" }
]
license = { text = "BSD-3-Clause" }
readme = "README.md"
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.10"
dependencies = [
    "tiferet>=2.1.1,<2.2",
    "tiferet-ly>=1.0.0b3,<1.0.0rc1",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/greatstrength/tiferet-elsl"
Repository = "https://github.com/greatstrength/tiferet-elsl"
Releases = "https://github.com/greatstrength/tiferet-elsl/releases"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "compiler*",
]

[tool.setuptools.package-data]
compiler = ["assets/*.yml"]

[project.scripts]
tiferet-compiler = "compiler.cli:main"

[tool.pytest.ini_options]
testpaths = ["compiler"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
