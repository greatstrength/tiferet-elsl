production_rules:
  - import_block_single:
      grammar_id: tiferet_dialect
      spec: "import_block : import_stmt"
      action: |
        p[0] = [p[1]]

  - import_block_multi:
      grammar_id: tiferet_dialect
      spec: "import_block : import_block import_stmt"
      action: |
        p[1].append(p[2])
        p[0] = p[1]

  - import_stmt:
      grammar_id: tiferet_dialect
      spec: "import_stmt : IMPORT import_expr NEWLINE"
      action: |
        ln, col = $pos(p, 1)
        p[0] = $stmt.new_import_stmt(p[2], lineno=ln, col=col)

  - import_stmt_from:
      grammar_id: tiferet_dialect
      spec: "import_stmt : FROM from_expr IMPORT import_expr NEWLINE"
      action: |
        ln, col = $pos(p, 1)
        p[0] = $stmt.new_import_stmt_from(p[2], p[4], lineno=ln, col=col)

  - import_expr:
      grammar_id: tiferet_dialect
      spec: "import_expr : IDENTIFIER"
      action: |
        p[0] = $expr.new_name_expr(p[1])

  - import_expr_paren:
      grammar_id: tiferet_dialect
      spec: "import_expr : LPAREN import_expr RPAREN"
      action: |
        p[0] = p[2]

  - import_expr_as:
      grammar_id: tiferet_dialect
      spec: "import_expr : import_expr AS IDENTIFIER"
      action: |
        p[0] = $expr.new_import_expr_as(p[1], p[3])

  - import_expr_multi:
      grammar_id: tiferet_dialect
      spec: "import_expr : import_expr COMMA IDENTIFIER"
      action: |
        p[0] = $expr.new_import_expr_multi(p[1], p[3])

  - import_expr_trailing_comma:
      grammar_id: tiferet_dialect
      spec: "import_expr : import_expr COMMA"
      action: |
        p[0] = p[1]

  - import_expr_dot:
      grammar_id: tiferet_dialect
      spec: "import_expr : import_expr DOT IDENTIFIER"
      action: |
        p[1].name += '.' + p[3]
        p[0] = p[1]

  - from_expr:
      grammar_id: tiferet_dialect
      spec: "from_expr : IDENTIFIER"
      action: |
        p[0] = $expr.new_name_expr(p[1])

  - from_expr_dot_only:
      grammar_id: tiferet_dialect
      spec: "from_expr : DOT"
      action: |
        p[0] = $expr.new_name_expr('.')

  - from_expr_dot:
      grammar_id: tiferet_dialect
      spec: "from_expr : DOT from_expr"
      action: |
        p[2].name = '.' + p[2].name
        p[0] = p[2]

  - from_expr_dot_middle:
      grammar_id: tiferet_dialect
      spec: "from_expr : from_expr DOT IDENTIFIER"
      action: |
        p[1].name += '.' + p[3]
        p[0] = p[1]

  - class_def:
      grammar_id: tiferet_dialect
      spec: "class_def : CLASS IDENTIFIER LPAREN super_cls_list RPAREN COLON NEWLINE INDENT class_body DEDENT"
      action: |
        ln, col = $pos(p, 1)
        p[0] = $decl.new_class_decl( name=p[2], subclasses=p[4], doc_string=p[9].get('docstring', None), members=[$stmt.new_decl_stmt(m) for m in (p[9].get('members') or [])], lineno=ln, col=col, )

  - class_def_no_parens:
      grammar_id: tiferet_dialect
      spec: "class_def : CLASS IDENTIFIER COLON NEWLINE INDENT class_body DEDENT"
      action: |
        ln, col = $pos(p, 1)
        p[0] = $decl.new_class_decl( name=p[2], subclasses=None, doc_string=p[6].get('docstring', None), members=[$stmt.new_decl_stmt(m) for m in (p[6].get('members') or [])], lineno=ln, col=col, )

  - class_body_doc:
      grammar_id: tiferet_dialect
      spec: "class_body : DOCSTRING NEWLINE member_list"
      action: |
        p[0] = {'docstring': p[1], 'members': p[3]}

  - class_body_nodoc:
      grammar_id: tiferet_dialect
      spec: "class_body : member_list"
      action: |
        p[0] = {'docstring': None, 'members': p[1]}

  - class_body_doc_pass:
      grammar_id: tiferet_dialect
      spec: "class_body : DOCSTRING NEWLINE PASS NEWLINE"
      action: |
        p[0] = {'docstring': p[1], 'members': []}

  - super_cls_list_empty:
      grammar_id: tiferet_dialect
      spec: "super_cls_list :"
      action: |
        p[0] = None

  - super_cls_list_single:
      grammar_id: tiferet_dialect
      spec: "super_cls_list : super_cls"

  - super_cls_multi:
      grammar_id: tiferet_dialect
      spec: "super_cls : super_cls COMMA super_cls"
      action: |
        p[1].set_subtype(p[3])
        p[0] = p[1]

  - super_cls:
      grammar_id: tiferet_dialect
      spec: "super_cls : IDENTIFIER"
      action: |
        p[0] = $type.new_class_type(name=p[1])

  - super_cls_kwarg:
      grammar_id: tiferet_dialect
      spec: "super_cls : IDENTIFIER EQUALS IDENTIFIER"
      action: |
        p[0] = $type.new_class_type(name=p[3])

  - attr_decl:
      grammar_id: tiferet_dialect
      spec: "attr_decl : IDENTIFIER NEWLINE"
      action: |
        ln, col = $pos(p, 1)
        p[0] = $decl.new_attr_decl(name=p[1], lineno=ln, col=col)

  - attr_decl_type:
      grammar_id: tiferet_dialect
      spec: "attr_decl : IDENTIFIER COLON attr_types NEWLINE"
      action: |
        ln, col = $pos(p, 1)
        p[0] = $decl.new_attr_decl(name=p[1], types=p[3], lineno=ln, col=col)

  - attr_decl_type_init:
      grammar_id: tiferet_dialect
      spec: "attr_decl : IDENTIFIER COLON attr_types EQUALS assign_rhs NEWLINE"
      action: |
        ln, col = $pos(p, 1)
        p[0] = $decl.new_attr_decl(name=p[1], types=p[3], value=p[5], lineno=ln, col=col)

  - attr_decl_init:
      grammar_id: tiferet_dialect
      spec: "attr_decl : IDENTIFIER EQUALS assign_rhs NEWLINE"
      action: |
        ln, col = $pos(p, 1)
        p[0] = $decl.new_attr_decl(name=p[1], value=p[3], lineno=ln, col=col)

  - const_decl:
      grammar_id: tiferet_dialect
      spec: "const_decl : IDENTIFIER EQUALS assign_rhs NEWLINE"
      action: |
        ln, col = $pos(p, 1)
        p[0] = $decl.new_attr_decl(name=p[1], value=p[3], lineno=ln, col=col)

  - const_decl_typed:
      grammar_id: tiferet_dialect
      spec: "const_decl : IDENTIFIER COLON attr_types EQUALS assign_rhs NEWLINE"
      action: |
        ln, col = $pos(p, 1)
        p[0] = $decl.new_attr_decl(name=p[1], types=p[3], value=p[5], lineno=ln, col=col)

  - const_block_single:
      grammar_id: tiferet_dialect
      spec: "const_block : const_decl"
      action: |
        p[0] = [p[1]]

  - const_block_multi:
      grammar_id: tiferet_dialect
      spec: "const_block : const_block const_decl"
      action: |
        p[1].append(p[2])
        p[0] = p[1]

  - type_atom_name:
      grammar_id: tiferet_dialect
      spec: "type_atom : IDENTIFIER"

  - type_atom_dot:
      grammar_id: tiferet_dialect
      spec: "type_atom : type_atom DOT IDENTIFIER"
      action: |
        p[0] = p[3]

  - type_atom_subscript:
      grammar_id: tiferet_dialect
      spec: "type_atom : IDENTIFIER LBRACK subscript_index RBRACK"
      action: |
        p[0] = p[1]

  - type_atom_none:
      grammar_id: tiferet_dialect
      spec: "type_atom : NONE"
      action: |
        p[0] = 'None'

  - type_atom_forward_ref:
      grammar_id: tiferet_dialect
      spec: "type_atom : STRING_LITERAL"
      action: |
        p[0] = p[1].strip('\'"')

  - attr_types_single:
      grammar_id: tiferet_dialect
      spec: "attr_types : type_atom"
      action: |
        p[0] = $get_attribute_type(p[1])

  - attr_types_multi:
      grammar_id: tiferet_dialect
      spec: "attr_types : attr_types PIPE type_atom"
      action: |
        p[1].set_subtype($get_attribute_type(p[3]))
        p[0] = p[1]

  - decorator_stmt:
      grammar_id: tiferet_dialect
      spec: "decorator_stmt : AT decorator_call NEWLINE"
      action: |
        p[0] = $stmt.new_expr_stmt(p[2])

  - decorator_stmt_bare:
      grammar_id: tiferet_dialect
      spec: "decorator_stmt : AT decorator_ident NEWLINE"
      action: |
        p[0] = $stmt.new_expr_stmt(p[2])

  - decorator_call:
      grammar_id: tiferet_dialect
      spec: "decorator_call : decorator_ident LPAREN decorator_args RPAREN"
      action: |
        p[0] = $expr.new_call_expr(p[1], p[3])

  - decorator_ident:
      grammar_id: tiferet_dialect
      spec: "decorator_ident : IDENTIFIER"
      action: |
        p[0] = $expr.new_name_expr(p[1])

  - decorator_ident_dot:
      grammar_id: tiferet_dialect
      spec: "decorator_ident : decorator_ident DOT IDENTIFIER"
      action: |
        ln, col = $pos(p, 1)
        p[0] = $expr.new_name_expr(name=p[1].name + '.' + p[3], lineno=ln, col=col)

  - decorator_params_single:
      grammar_id: tiferet_dialect
      spec: "decorator_args : decorator_arg"
      action: |
        p[0] = $expr.new_args_list_expr(p[1])

  - decorator_args_multi:
      grammar_id: tiferet_dialect
      spec: "decorator_args : decorator_args COMMA decorator_arg"
      action: |
        p[0] = $expr.new_args_list_expr(p[1], p[3])

  - decorator_arg_literal:
      grammar_id: tiferet_dialect
      spec: "decorator_arg : name_or_literal_expr"

  - decorator_arg_kwarg:
      grammar_id: tiferet_dialect
      spec: "decorator_arg : IDENTIFIER EQUALS name_or_literal_expr"
      action: |
        p[0] = $expr.new_kwarg_expr(name=p[1], value=p[3])

  - method_decl:
      grammar_id: tiferet_dialect
      spec: "method_decl : DEF method_name method_type COLON NEWLINE INDENT method_doc_string snippet_list DEDENT"
      action: |
        ln, col = $pos(p, 1)
        p[0] = $decl.new_func_decl( name=p[2], type=p[3], doc_string=p[7], body=p[8], lineno=ln, col=col, )

  - method_name:
      grammar_id: tiferet_dialect
      spec: "method_name : IDENTIFIER\n| INIT"
      action: |
        p[0] = p[1]

  - method_type:
      grammar_id: tiferet_dialect
      spec: "method_type : LPAREN method_param_list RPAREN ret_annot"
      action: |
        p[0] = $type.new_func_type(params=p[2], return_type=p[4])

  - method_doc_string:
      grammar_id: tiferet_dialect
      spec: "method_doc_string : DOCSTRING NEWLINE"
      action: |
        p[0] = p[1]

  - method_doc_string_empty:
      grammar_id: tiferet_dialect
      spec: "method_doc_string :"
      action: |
        p[0] = None

  - method_param_list:
      grammar_id: tiferet_dialect
      spec: "method_param_list : SELF COMMA param_list"
      action: |
        self_param = $param_list.new(name=p[1], type=$type.new_unknown_type())
        p[0] = [self_param] + p[3]

  - method_param_list_self_only:
      grammar_id: tiferet_dialect
      spec: "method_param_list : SELF"
      action: |
        p[0] = [$param_list.new(name=p[1], type=$type.new_unknown_type())]

  - method_param_list_no_self:
      grammar_id: tiferet_dialect
      spec: "method_param_list : param_list"

  - method_param_list_empty:
      grammar_id: tiferet_dialect
      spec: "method_param_list :"
      action: |
        p[0] = []

  - method_param_list_single:
      grammar_id: tiferet_dialect
      spec: "param_list : param"
      action: |
        p[0] = [p[1]]

  - method_param_list_multi:
      grammar_id: tiferet_dialect
      spec: "param_list : param_list COMMA param"
      action: |
        p[1].append(p[3])
        p[0] = p[1]

  - param_list_trailing_comma:
      grammar_id: tiferet_dialect
      spec: "param_list : param_list COMMA"
      action: |
        p[0] = p[1]

  - method_param:
      grammar_id: tiferet_dialect
      spec: "param : IDENTIFIER"
      action: |
        p[0] = $param_list.new(name=p[1])

  - method_param_args:
      grammar_id: tiferet_dialect
      spec: "param : STAR IDENTIFIER"
      action: |
        p[0] = $param_list.new_args_param(name=p[2])

  - method_param_kwargs:
      grammar_id: tiferet_dialect
      spec: "param : DOUBLESTAR IDENTIFIER"
      action: |
        p[0] = $param_list.new_kwargs_param(name=p[2])

  - method_param_type:
      grammar_id: tiferet_dialect
      spec: "param : param COLON param_types"
      action: |
        p[1].set_type(p[3])
        p[0] = p[1]

  - param_default:
      grammar_id: tiferet_dialect
      spec: "param : param EQUALS unary_expr"
      action: |
        p[1].set_default(p[3])
        p[0] = p[1]

  - param_newline:
      grammar_id: tiferet_dialect
      spec: "param : NEWLINE param"
      action: |
        p[0] = p[2]

  - method_param_types_single:
      grammar_id: tiferet_dialect
      spec: "param_types : type_atom"
      action: |
        p[0] = $get_attribute_type(p[1])

  - method_param_types_multi:
      grammar_id: tiferet_dialect
      spec: "param_types : param_types PIPE type_atom"
      action: |
        subtype = $get_attribute_type(p[3])
        p[1].set_subtype(subtype)
        p[0] = p[1]

  - ret_annot:
      grammar_id: tiferet_dialect
      spec: "ret_annot : ARROW ret_types"
      action: |
        p[0] = p[2]

  - ret_annot_empty:
      grammar_id: tiferet_dialect
      spec: "ret_annot :"
      action: |
        p[0] = $type.new_null_type()

  - ret_types_single:
      grammar_id: tiferet_dialect
      spec: "ret_types : type_atom"
      action: |
        p[0] = $get_attribute_type(p[1])

  - ret_types_multi:
      grammar_id: tiferet_dialect
      spec: "ret_types : ret_types PIPE type_atom"
      action: |
        ret_type = $get_attribute_type(p[3])
        p[1].set_return_type(ret_type)
        p[0] = p[1]

  - snippet_list:
      grammar_id: tiferet_dialect
      spec: "snippet_list : snippet_list snippet"
      action: |
        p[1].append(p[2])
        p[0] = p[1]

  - snippet_list_newline:
      grammar_id: tiferet_dialect
      spec: "snippet_list : snippet_list NEWLINE"
      action: |
        p[0] = p[1]

  - snippet_list_empty:
      grammar_id: tiferet_dialect
      spec: "snippet_list :"
      action: |
        p[0] = []

  - snippet_list_else_attach:
      grammar_id: tiferet_dialect
      spec: "snippet_list : snippet_list comment_list else_clause"
      action: |
        if p[1]:
            $attach_dangling_else(p[1][-1].body, p[3])
        p[0] = p[1]

  - snippet_comment:
      grammar_id: tiferet_dialect
      spec: "snippet : comment_list stmt_list"
      action: |
        p[0] = $snippet_stmt.new_snippet_stmt(comments=p[1], code=p[2])

  - snippet_nocomment:
      grammar_id: tiferet_dialect
      spec: "snippet : stmt_list"
      action: |
        p[0] = $snippet_stmt.new_snippet_stmt(code=p[1])

  - comment_list_single:
      grammar_id: tiferet_dialect
      spec: "comment_list : comment_stmt"
      action: |
        p[0] = [p[1]]

  - comment_list_multi:
      grammar_id: tiferet_dialect
      spec: "comment_list : comment_list comment_stmt"
      action: |
        p[1].append(p[2])
        p[0] = p[1]

  - comment_stmt:
      grammar_id: tiferet_dialect
      spec: "comment_stmt : LINE_COMMENT NEWLINE"
      action: |
        ln, col = $pos(p, 1)
        expr = $expr.new_comment_expr(p[1], lineno=ln, col=col)
        p[0] = $stmt.new_comment_stmt(expr, lineno=ln, col=col)

  - stmt_list_single:
      grammar_id: tiferet_dialect
      spec: "stmt_list : stmt"
      action: |
        p[0] = [p[1]]

  - stmt_list:
      grammar_id: tiferet_dialect
      spec: "stmt_list : stmt_list stmt"
      action: |
        p[1].append(p[2])
        p[0] = p[1]

  - stmt_list_newline:
      grammar_id: tiferet_dialect
      spec: "stmt_list : stmt_list NEWLINE"
      action: |
        p[0] = p[1]

  - stmt_list_empty:
      grammar_id: tiferet_dialect
      spec: "stmt_list :"
      action: |
        p[0] = []

  - stmt_return:
      grammar_id: tiferet_dialect
      spec: "stmt : RETURN return_expr NEWLINE"
      action: |
        ln, col = $pos(p, 1)
        p[0] = $stmt.new_return_stmt(return_expr=p[2], lineno=ln, col=col)

  - stmt_yield:
      grammar_id: tiferet_dialect
      spec: "stmt : YIELD yield_values NEWLINE"
      action: |
        ln, col = $pos(p, 1)
        yielded = $expr.new_tuple_expr(elements=p[2], lineno=ln, col=col)
        p[0] = $stmt.new_expr_stmt(yielded, lineno=ln, col=col)

  - yield_values_single:
      grammar_id: tiferet_dialect
      spec: "yield_values : operation_expr"
      action: |
        p[0] = $expr.new_args_list_expr(p[1])

  - yield_values_multi:
      grammar_id: tiferet_dialect
      spec: "yield_values : yield_values COMMA operation_expr"
      action: |
        p[0] = $expr.new_args_list_expr(p[1], p[3])

  - stmt_assign:
      grammar_id: tiferet_dialect
      spec: "stmt : assign_expr NEWLINE"
      action: |
        ln, col = $pos(p, 1)
        p[0] = $stmt.new_expr_stmt(p[1], lineno=ln, col=col)

  - stmt_annotated_assign:
      grammar_id: tiferet_dialect
      spec: "stmt : IDENTIFIER COLON attr_types EQUALS assign_rhs NEWLINE"
      action: |
        ln, col = $pos(p, 1)
        target = $expr.new_name_expr(p[1], lineno=ln, col=col)
        assign = $expr.new_assign_expr(target=target, value=p[5], lineno=ln, col=col)
        p[0] = $stmt.new_expr_stmt(assign, lineno=ln, col=col)

  - stmt_operator:
      grammar_id: tiferet_dialect
      spec: "stmt : operation_expr NEWLINE"
      action: |
        ln, col = $pos(p, 1)
        p[0] = $stmt.new_expr_stmt(p[1], lineno=ln, col=col)

  - stmt_call:
      grammar_id: tiferet_dialect
      spec: "stmt : call_expr NEWLINE"
      action: |
        ln, col = $pos(p, 1)
        p[0] = $stmt.new_expr_stmt(p[1], lineno=ln, col=col)

  - stmt_import_local:
      grammar_id: tiferet_dialect
      spec: "stmt : import_stmt"
      action: |
        p[0] = p[1]

  - block_body_stmt:
      grammar_id: tiferet_dialect
      spec: "block_body : stmt"
      action: |
        p[0] = [p[1]]

  - block_body_comment:
      grammar_id: tiferet_dialect
      spec: "block_body : comment_stmt"
      action: |
        p[0] = [p[1]]

  - block_body_extend_stmt:
      grammar_id: tiferet_dialect
      spec: "block_body : block_body stmt"
      action: |
        p[1].append(p[2])
        p[0] = p[1]

  - block_body_extend_comment:
      grammar_id: tiferet_dialect
      spec: "block_body : block_body comment_stmt"
      action: |
        p[1].append(p[2])
        p[0] = p[1]

  - block_body_newline:
      grammar_id: tiferet_dialect
      spec: "block_body : block_body NEWLINE"
      action: |
        p[0] = p[1]

  - block_body_empty:
      grammar_id: tiferet_dialect
      spec: "block_body :"
      action: |
        p[0] = []

  - block_body_else_attach:
      grammar_id: tiferet_dialect
      spec: "block_body : block_body comment_list else_clause"
      action: |
        $attach_dangling_else(p[1], p[3])
        p[0] = p[1]

  - stmt_if:
      grammar_id: tiferet_dialect
      spec: "stmt : IF operation_expr COLON NEWLINE INDENT block_body DEDENT opt_else"
      action: |
        ln, col = $pos(p, 1)
        p[0] = $stmt.new_if_stmt(condition=p[2], body=p[6], else_body=p[8], lineno=ln, col=col)

  - stmt_if_inline:
      grammar_id: tiferet_dialect
      spec: "stmt : IF operation_expr COLON stmt"
      action: |
        ln, col = $pos(p, 1)
        p[0] = $stmt.new_if_stmt(condition=p[2], body=p[4], lineno=ln, col=col)

  - opt_else:
      grammar_id: tiferet_dialect
      spec: "opt_else : else_clause"

  - opt_else_empty:
      grammar_id: tiferet_dialect
      spec: "opt_else :"
      action: |
        p[0] = None

  - else_clause:
      grammar_id: tiferet_dialect
      spec: "else_clause : ELSE COLON NEWLINE INDENT block_body DEDENT"
      action: |
        p[0] = p[5]

  - else_clause_inline:
      grammar_id: tiferet_dialect
      spec: "else_clause : ELSE COLON stmt"
      action: |
        p[0] = [p[3]]

  - elif_clause:
      grammar_id: tiferet_dialect
      spec: "else_clause : ELIF operation_expr COLON NEWLINE INDENT block_body DEDENT opt_else"
      action: |
        ln, col = $pos(p, 1)
