  - RBRACK:
      grammar_id: tiferet_dialect
      pattern: \]

  - LBRACE:
      grammar_id: tiferet_dialect
      pattern: \{

  - RBRACE:
      grammar_id: tiferet_dialect
      pattern: \}

  - COMMA:
      grammar_id: tiferet_dialect
      pattern: ','

  - COLON:
      grammar_id: tiferet_dialect
      pattern: ':'

  - ELLIPSIS:
      grammar_id: tiferet_dialect
      pattern: \.\.\.

  - DOT:
      grammar_id: tiferet_dialect
      pattern: \.

  - EQUALS:
      grammar_id: tiferet_dialect
      pattern: '='

  - NEWLINE:
      grammar_id: tiferet_dialect
      pattern: (?:[ \t]*\n)+
      action: |
        t.lexer.lineno += t.value.count('\n')
        return t

